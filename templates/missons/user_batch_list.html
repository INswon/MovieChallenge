{% extends 'base.html' %}
{% load static %}

{% block title %}バッジ一覧 | ムードシネマ{% endblock %}

{% block page_bg_wrapper_class %}home-bg{% endblock %}

{% block content %}
<section class="badges-hero">
    <div class="container badge-container">
        <h2 class="badge-page-title">バッジ一覧</h2>

        <div class="badge-section">
            <h3 class="badge-section-title">取得済みバッジ</h3>
            <div class="badge-grid" id="obtained-badges">
                <p class="text-center">読み込み中...</p>
            </div>
        </div>

        <div class="badge-section">
            <h3 class="badge-section-title">未取得バッジ</h3>
            <div class="badge-grid" id="unobtained-badges">
                <p class="text-center">読み込み中...</p>
            </div>
        </div>
    </div>
</section>

<script src="{% static 'js/missions/batch_list.js' %}" type="text/javascript" defer></script>
{% endblock %}
